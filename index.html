<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Until the Candle Melts</title>

    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <h2>Study Until...</h2>

        <section class="animation-area">
            <nav class="timer-mode-buttons" aria-label="Timer mode">
                <button
                    id="study-mode-button"
                    class="mode-button active"
                    type="button"
                >
                    Study
                </button>

                <button
                    id="short-break-button"
                    class="mode-button"
                    type="button"
                >
                    Short Break
                </button>

                <button
                    id="long-break-button"
                    class="mode-button"
                    type="button"
                >
                    Long Break
                </button>
            </nav>

            <div id="journeyMessage">Study Until the Candle Melts</div>

            <div class="candle-scene" aria-hidden="true">
                <div class="candle">
                    <div class="flame"></div>
                    <div class="wax-drip drip-one"></div>
                    <div class="wax-drip drip-two"></div>
                    <div class="wax-drip drip-three"></div>
                </div>

                <div class="melted-wax"></div>
            </div>

            <div id="timer" role="timer" aria-live="off">25:00</div>

            <div class="timer-controls">
                <button id="start-button" type="button">START</button>
                <button id="pause-button" type="button">PAUSE</button>
                <button id="reset-button" type="button">RESET</button>
            </div>

            <section id="study-settings" class="study-time">
                <h2>Study time</h2>

                <button id="quick-button" type="button">
                    <span>Quick</span>
                    <span>15 min</span>
                </button>

                <button id="classic-button" type="button">
                    <span>Classic</span>
                    <span>25 min</span>
                </button>

                <button id="deep-button" type="button">
                    <span>Deep</span>
                    <span>45 min</span>
                </button>

                <button id="custom-button" type="button">
                    Custom
                </button>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
